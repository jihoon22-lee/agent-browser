<!doctype html><html lang="ko"><meta charset="utf-8"><title>Synthetic catalog</title>
<h1>합성 상품 목록</h1><p>검증용 가상 데이터만 사용합니다.</p>
<form method="get"><label>검색어 <input name="q"></label><label>분류 <select name="category"><option value="all">전체</option><option value="office">사무</option></select></label><button>검색</button></form>
<p id="query"></p><ul><li><a href="journey-detail.html?id=A">상품 A · 12000</a></li><li><a href="journey-detail.html?id=B">상품 B · 18000</a></li></ul>
<label>비교 메모 <textarea id="note"></textarea></label><button id="save">메모 저장</button><p id="saved" aria-live="polite"></p>
<script>
const params=new URLSearchParams(location.search);document.querySelector('input').value=params.get('q')||'';document.querySelector('input').defaultValue=document.querySelector('input').value;document.querySelector('#query').textContent='검색 결과: '+(params.get('q')||'전체');
document.querySelector('#save').onclick=()=>{const el=document.querySelector('#note');el.defaultValue=el.value;document.querySelector('#saved').textContent='저장됨: '+el.value};
</script></html>
